# ==========================================
# 1. THE CONTROLLER MANAGER (The Boss)
# ==========================================
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    # Declare the controllers we want to use
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ==========================================
# 2. CONTROLLER CONFIGURATION (The Workers)
# ==========================================

# Broadcasts joint positions to /joint_states for RViz
joint_state_broadcaster:
  ros__parameters:
    # No extra parameters needed for basic setup
    pass

# Handles synchronized movement for multiple joints
joint_trajectory_controller:
  ros__parameters:
    # 3. JOINT MAPPING
    # Replace these with your actual URDF joint names
    joints:
      - joint_1
      - joint_2
      
    command_interfaces:
      - position
      
    state_interfaces:
      - position
      - velocity
      
    # Optional: Add constraints or PID gains here if needed
    state_publish_rate: 50.0
    action_monitor_rate: 20.0